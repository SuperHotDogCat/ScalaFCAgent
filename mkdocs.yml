site_name: function-calling-made-by-FP
site_description: LLM ServerとユーザーのあいだでTool呼び出しを仲介するScalaライブラリ
site_url: https://superhotdogcat.github.io/ScalaFCAgent/
repo_url: https://github.com/SuperHotDogCat/ScalaFCAgent
repo_name: SuperHotDogCat/ScalaFCAgent
edit_uri: edit/main/docs/

docs_dir: docs
strict: true

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

plugins:
  - search
  # 削除した旧ページのURLを新しいページへ転送する
  - redirects:
      redirect_maps:
        reference/core.md: api/README.md
        reference/http-server.md: api/server.md

nav:
  - Home: README.md
  - Quick Start: quickstart.md
  - 使用ライブラリ入門: libraries.md
  - Examples:
      - examples/README.md
      - Basic:
          - 対話CLIエージェント: examples/basic/interactive_cli.md
      - Tools:
          - 型付きToolを作る: examples/tools/typed_tools.md
          - Shellを実行するTool: examples/tools/shell_tool.md
      - Serving:
          - OpenAI互換HTTPサーバ: examples/serving/openai_compatible_server.md
      - Features:
          - ChatFormat: examples/features/custom_chat_format.md
      - Testing:
          - モックLLMServer: examples/testing/mock_llm_server.md
  - API Reference:
      - api/README.md
      - agent: api/agent.md
      - tool: api/tool.md
      - tool.defaults: api/defaults.md
      - chat: api/chat.md
      - llm: api/llm.md
      - client: api/client.md
      - server: api/server.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
