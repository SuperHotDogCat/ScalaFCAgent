/*
 * Function Calling の中核 (コアライブラリ)
 * CLI/HTTP などの入口は置かず, 公開API (Agent) だけを提供する
 */

plugins {
    id 'scala'
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // Use Scala 2.13 in our library project
    implementation libs.scala.library

    implementation 'io.circe:circe-core_2.13:0.14.15'
    implementation 'io.circe:circe-parser_2.13:0.14.15'
    implementation 'io.circe:circe-generic_2.13:0.14.15'

    // IO は公開APIに出るため api で公開する
    api 'org.typelevel:cats-effect_2.13:3.6.3'

    // ストリーミング (Stream) も公開APIに出るため api で公開する
    api 'co.fs2:fs2-core_2.13:3.11.0'

    // Use Scalatest for testing our library
    testImplementation libs.junit
    testImplementation libs.scalatest.v2.v13
    testImplementation libs.junit.v4.v13.v2.v13
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
